name: Send emails weekly
on:
  workflow_dispatch:
  schedule:
    # Primary slot: Tue 06:17 Beijing (Mon 22:17 UTC, off the hour to dodge scheduler congestion).
    # Backup slots: Tue 22:19 / Wed 10:23 Beijing, deliberately spread over ~1.5
    # days so retries land on a different shared-IP batch of GitHub runners.
    # arXiv 429-blocks on those shared IPs last an hour or more; the in-job
    # retries in arxiv_retriever (~1.8h of backoff) ride out most blocks, and
    # these later slots cover the rest. The skip-check step makes every slot
    # idempotent: if this week's email already went out (or a run is in
    # progress), the later slots exit without doing anything. The 36h lookback
    # spans the primary-to-last-backup gap so no slot double-sends.
    - cron: '17 22 * * 1'
    - cron: '19 14 * * 2'
    - cron: '23 02 * * 3'

permissions:
  contents: read
  actions: read

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if this week's email was already sent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE=$(date -u -d '36 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Looking for runs of this workflow since $SINCE (excluding this run ${{ github.run_id }})"
          PRIOR=$(gh api --paginate "repos/${{ github.repository }}/actions/workflows/main.yml/runs?created=%3E%3D${SINCE}" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | select((.status == "completed" and .conclusion == "success") or .status == "in_progress" or .status == "queued") | .id')
          if [ -n "$PRIOR" ]; then
            echo "This week's email was already sent (or is being sent) by run(s): $PRIOR -- nothing to do."
            echo "SKIP_REST=true" >> "$GITHUB_ENV"
          else
            echo "No successful run in the last 24h; proceeding."
          fi

      - name: Checkout
        if: env.SKIP_REST != 'true'
        uses: actions/checkout@v6

      - name: Setup uv
        if: env.SKIP_REST != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Run script
        if: env.SKIP_REST != 'true'
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py
