name: Send emails weekly
on:
  workflow_dispatch:
  schedule:
    # Primary slot: Tue 06:17 Beijing (Mon 22:17 UTC, off the hour to dodge scheduler congestion).
    # Backup slots: Tue 22:19 / Wed 10:23 Beijing, deliberately spread over ~1.5
    # days so retries land on a different shared-IP batch of GitHub runners.
    # arXiv 429-blocks on those shared IPs last an hour or more; the in-job
    # retries in arxiv_retriever (~1.8h of backoff) ride out most blocks, and
    # these later slots cover the rest. The skip-check step makes every slot
    # idempotent: if this week's email already went out (or a run is in
    # progress), the later slots exit without doing anything. The 36h lookback
    # spans the primary-to-last-backup gap so no slot double-sends.
    - cron: '17 22 * * 1'
    - cron: '19 14 * * 2'
    - cron: '23 02 * * 3'

permissions:
  contents: read
  actions: read

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Skip if this week's email was already sent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE=$(date -u -d '36 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Looking for runs of this workflow since $SINCE (excluding this run ${{ github.run_id }})"
          PRIOR=$(gh api --paginate "repos/${{ github.repository }}/actions/workflows/main.yml/runs?created=%3E%3D${SINCE}" \
            --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | select((.status == "completed" and .conclusion == "success") or .status == "in_progress" or .status == "queued") | .id')
          if [ -n "$PRIOR" ]; then
            echo "This week's email was already sent (or is being sent) by run(s): $PRIOR -- nothing to do."
            echo "SKIP_REST=true" >> "$GITHUB_ENV"
          else
            echo "No successful run in the last 24h; proceeding."
          fi

      - name: Checkout
        if: env.SKIP_REST != 'true'
        uses: actions/checkout@v6

      - name: Setup uv
        if: env.SKIP_REST != 'true'
        uses: astral-sh/setup-uv@v7

      - name: Run script
        if: env.SKIP_REST != 'true'
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        # The pipeline is only "working" while digest emails keep arriving;
        # without this step a fully rate-limited week fails silently. Any
        # step failure (including a rare skip-check hiccup) sends a short
        # heads-up mail using the same SMTP account as the digest itself.
        run: |
          python3 - <<'PYEOF'
          import os, re, smtplib
          from email.header import Header
          from email.mime.text import MIMEText
          from email.utils import formataddr

          run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          smtp_server, smtp_port = "smtp.qq.com", 465
          try:
              cfg = open("config/custom.yaml", encoding="utf-8").read()
              server = re.search(r"smtp_server:\s*['\"]?([^\s'\"#]+)", cfg)
              port = re.search(r"smtp_port:\s*['\"]?(\d+)", cfg)
              if server: smtp_server = server.group(1)
              if port: smtp_port = int(port.group(1))
          except OSError:
              pass

          sender = os.environ["SENDER"]
          receiver = os.environ["RECEIVER"]
          password = os.environ["SENDER_PASSWORD"]
          body = (
              "This week's zotero-arxiv-daily run FAILED, so no digest email went out.\n\n"
              f"Run details: {run_url}\n\n"
              "The remaining schedule slots this week will retry automatically; "
              "you can also re-run the workflow manually."
          )
          msg = MIMEText(body, "plain", "utf-8")
          msg["From"] = formataddr((Header("Github Action", "utf-8").encode(), sender))
          msg["To"] = formataddr((Header("You", "utf-8").encode(), receiver))
          msg["Subject"] = Header("Weekly arXiv digest FAILED", "utf-8").encode()
          try:
              conn = smtplib.SMTP(smtp_server, smtp_port, timeout=60)
              conn.starttls()
          except Exception:
              try:
                  conn = smtplib.SMTP_SSL(smtp_server, smtp_port, timeout=60)
              except Exception:
                  conn = smtplib.SMTP(smtp_server, smtp_port, timeout=60)
          with conn:
              conn.login(sender, password)
              conn.sendmail(sender, [receiver], msg.as_string())
          print("Failure notification sent.")
          PYEOF
