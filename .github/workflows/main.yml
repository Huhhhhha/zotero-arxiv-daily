name: Send emails weekly
on:
  workflow_dispatch:
    inputs:
      digest_date:
        description: "Tuesday to recover (YYYY-MM-DD); blank means the latest weekly digest"
        required: false
        type: string
      force:
        description: "Send again even if a delivery receipt exists"
        required: false
        default: false
        type: boolean
  schedule:
    # Beijing 06:17 / 22:19 / 10:23 each day. Tuesday is the primary
    # delivery day; later slots recover a missed trigger or failed send.
    # A receipt for the Tuesday digest keeps every later slot idempotent.
    - cron: '17 22 * * *'
    - cron: '19 14 * * *'
    - cron: '23 02 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-arxiv-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check weekly delivery receipt
        id: delivery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_DIGEST_DATE: ${{ inputs.digest_date }}
          FORCE_SEND: ${{ inputs.force }}
        run: python3 .github/scripts/weekly_digest.py

      - name: Setup uv
        if: steps.delivery.outputs.should_send == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Run script
        if: steps.delivery.outputs.should_send == 'true'
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          DIGEST_DATE: ${{ steps.delivery.outputs.digest_date }}
          DIGEST_AS_OF: ${{ steps.delivery.outputs.as_of }}
          DIGEST_RECEIPT_PATH: ${{ runner.temp }}/digest-delivery.json
        run: |
          printf '%s\n' "$CUSTOM_CONFIG" > config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py \
            "source.arxiv.as_of=$DIGEST_AS_OF" executor.send_empty=true

      - name: Save SMTP delivery receipt
        if: steps.delivery.outputs.should_send == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.delivery.outputs.receipt_name }}
          path: ${{ runner.temp }}/digest-delivery.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, re, smtplib
          from email.header import Header
          from email.mime.text import MIMEText
          from email.utils import formataddr

          run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          smtp_server, smtp_port = "smtp.qq.com", 465
          try:
              cfg = open("config/custom.yaml", encoding="utf-8").read()
              server = re.search(r"smtp_server:\s*['\"]?([^\s'\"#]+)", cfg)
              port = re.search(r"smtp_port:\s*['\"]?(\d+)", cfg)
              if server: smtp_server = server.group(1)
              if port: smtp_port = int(port.group(1))
          except OSError:
              pass

          sender = os.environ["SENDER"]
          receiver = os.environ["RECEIVER"]
          password = os.environ["SENDER_PASSWORD"]
          body = (
              "The weekly zotero-arxiv-daily workflow failed.\n\n"
              f"Run details: {run_url}\n\n"
              "Later daily slots retry automatically unless an SMTP delivery receipt exists. "
              "If receipt upload failed after sending, check the logs before forcing a resend."
          )
          msg = MIMEText(body, "plain", "utf-8")
          msg["From"] = formataddr((Header("Github Action", "utf-8").encode(), sender))
          msg["To"] = formataddr((Header("You", "utf-8").encode(), receiver))
          msg["Subject"] = Header("Weekly arXiv digest workflow FAILED", "utf-8").encode()
          if smtp_port == 465:
              conn = smtplib.SMTP_SSL(smtp_server, smtp_port, timeout=60)
          else:
              conn = smtplib.SMTP(smtp_server, smtp_port, timeout=60)
              conn.starttls()
          with conn:
              conn.login(sender, password)
              conn.sendmail(sender, [receiver], msg.as_string())
          print("Failure notification sent.")
          PYEOF
