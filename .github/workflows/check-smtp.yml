name: Check SMTP authentication
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-smtp:
    name: Verify SMTP login without sending mail
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SENDER: ${{ secrets.SENDER }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check SMTP login
        run: python3 .github/scripts/check_smtp.py
