name: Check SMTP authentication
on:
  workflow_dispatch:

permissions: {}

jobs:
  check-smtp:
    name: Verify SMTP login without sending mail
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SENDER: ${{ secrets.SENDER }}
      SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
      CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
    steps:
      - name: Check SMTP login
        run: |
          python3 - <<'PY'
          import os
          import re
          import smtplib
          import sys

          config = os.environ.get("CUSTOM_CONFIG", "")
          server = re.search(r"^\s*smtp_server:\s*['\"]?([^\s'\"#]+)", config, re.MULTILINE)
          port = re.search(r"^\s*smtp_port:\s*['\"]?(\d+)", config, re.MULTILINE)
          sender = os.environ.get("SENDER", "")
          password = os.environ.get("SENDER_PASSWORD", "")
          if not (server and port and sender and password):
              sys.exit("SMTP host, port, sender, or authorization code is missing.")
          try:
              if int(port.group(1)) == 465:
                  connection = smtplib.SMTP_SSL(server.group(1), int(port.group(1)), timeout=30)
              else:
                  connection = smtplib.SMTP(server.group(1), int(port.group(1)), timeout=30)
                  connection.starttls()
              with connection:
                  connection.login(sender, password)
              print("SMTP authentication succeeded. No email was sent.")
          except smtplib.SMTPAuthenticationError as exc:
              sys.exit(f"SMTP login was rejected (status {exc.smtp_code}).")
          except (smtplib.SMTPException, OSError) as exc:
              sys.exit(f"SMTP login did not complete: {type(exc).__name__}.")
          PY
